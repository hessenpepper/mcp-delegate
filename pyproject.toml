[project]
name = "mcp-delegate"
version = "0.1.0"
description = "MCP server for delegating subagent tasks to local/other-provider models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0",
    "openai>=1.50.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["delegate"]
